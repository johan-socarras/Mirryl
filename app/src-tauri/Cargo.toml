[package]
name = "autowifiadb-assistant"
version = "1.0.12"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
wait-timeout = "0.2"

# QR pairing (own clean-room implementation of Android's adb-tls-pairing
# protocol - see qr_pairing.rs - no GPL dependency, only permissively
# licensed crates below).
curve25519-dalek = "4"
num-bigint = "0.4"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mdns-sd = "0.20"
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
hex = "0.4"

# Per-PC signing key for phone matriculation (matriculation.rs): unlike the
# SEAL_PEPPER constant shared with the APK, it stays secret. ECDSA P-256 rather
# than Ed25519: the Android side
# (minSdk 30) verifies this with the platform's own java.security, which has
# supported P-256 since always but only gained Ed25519 on API 33+. Same
# RustCrypto family as sha2/curve25519-dalek/hkdf/aes-gcm above - permissive
# Apache-2.0/MIT, nothing new to review.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

# Painting the native title bar to match the app's own theme. Windows 11 only
# (build 22000+): on anything older DwmSetWindowAttribute rejects these
# attributes and the caption simply stays default, so there is no compile-time
# version gate - the failure is handled at the call site.
#
# Win32_Security* and Win32_System_Threading: DPAPI (CryptProtectData) and the
# owner-only DACL on pc_identity.json (matriculation.rs). Same crate, same
# version - only more of its bindings switched on, nothing new in the
# dependency graph.
#
# Win32_Storage_Packaging_Appx: GetCurrentPackageFullName, to tell the
# Microsoft Store package apart from the regular install (main.rs,
# is_store_package). Same crate again.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
] }
# %LOCALAPPDATA% through SHGetKnownFolderPath rather than the environment
# variable (main.rs, local_data_dir): the writable folder for logs and the
# scratch scripts, which the Store package cannot keep next to the exe. Not a
# new component in the licence inventory: dirs 6.0.0 is already linked in,
# transitively, through Tauri.
dirs = "6"

# Linux: the same `dirs` for the writable data folders (main.rs,
# local_data_dir, roaming_app_dir), and gtk for writing the phone's copied text
# to the clipboard while a mirror sits in a tab (main.rs,
# set_clipboard_from_engine). Neither is a new component: both are already in
# the graph, at these versions, through Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"
gtk = "0.18"
