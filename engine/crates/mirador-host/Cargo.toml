[package]
name = "mirador-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mirador"
path = "src/main.rs"

[dependencies]
mirador-core = { path = "../mirador-core" }
# Only for the viewer's session token (viewer.rs, session_token): the token is
# the one thing standing between a local page and full control of the phone,
# so it must not be guessable. Already in Cargo.lock (0.2.17)
# as a transitive dependency, so this asks for the OS CSPRNG through a crate
# that is in the graph anyway rather than pulling in a new component.
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"] }
wry = { version = "0.55.1", default-features = false }
raw-window-handle = "0.6"
# Only for the WM_SIZING subclass that locks the mirror window to the phone's
# aspect ratio (native_window.rs, install_aspect_lock) - already in the
# dependency graph transitively via wry/webview2-com, so this just asks for
# the extra modules rather than pulling in a new version.
# DataExchange/Memory/Ole: writing the phone's copied text to the Windows
# clipboard (viewer.rs, set_pc_clipboard) - more modules, same crate.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

# Linux: the same tao window and wry web view as Windows, over GTK + WebKitGTK
# instead of Win32 + WebView2. `os-webview` is what turns the WebKitGTK backend
# on (on Windows the WebView2 one is always there). gtk and libc are already in
# the graph through tao and wry; they are named here for the aspect-ratio hint
# and the clipboard (native_window.rs) and for ending the session cleanly on
# SIGTERM (main.rs, end_session_on_signals).
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"] }
wry = { version = "0.55.1", default-features = false, features = ["os-webview"] }
gtk = "0.18"
libc = "0.2"
