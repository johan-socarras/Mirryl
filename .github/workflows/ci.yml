# Builds and tests Mirryl on every push to main and every pull request, the
# same way docs/BUILD.md does by hand: the phone app first, then on Ubuntu and
# on Windows the engine (tests and release build), the app's tests, and the
# package (.deb on Ubuntu, the NSIS installer on Windows).
#
# Two differences from a release build, both on purpose:
# - the phone app is signed with a throwaway key made for this run; releases
#   are signed with the real one, which never leaves its owner's PC;
# - Windows uses the runner's default MSVC toolchain; the published installer
#   is built with the GNU one, as docs/BUILD.md describes.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  phone-app:
    name: Phone app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The runner image comes with a JDK and the Android SDK (build-tools and
      # platforms), which is all build.sh needs.
      - name: Build the APK with a throwaway key
        working-directory: android
        env:
          MIRRYL_KEYSTORE: ${{ runner.temp }}/ci-only.keystore
          MIRRYL_KEYSTORE_PASS: ci-only-throwaway
        run: |
          keytool -genkeypair -keystore "$MIRRYL_KEYSTORE" -storetype PKCS12 -alias mirryl \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Mirryl CI" \
            -storepass:env MIRRYL_KEYSTORE_PASS -keypass:env MIRRYL_KEYSTORE_PASS
          bash build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: phone-app
          path: |
            android/build/Mirryl.apk
            android/build/Mirryl.apk.version
          retention-days: 3

  build:
    name: ${{ matrix.name }}
    needs: phone-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
            bundle: deb
          - name: Windows
            os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    env:
      # One target folder for the engine and the app: the app's build picks
      # the engine up from there.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: phone-app
          path: android/build

      - name: Install the libraries Tauri and the engine build against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> ../target
            app/src-tauri -> ../../target

      - name: Engine tests
        working-directory: engine
        run: cargo test --release --locked

      - name: Engine build
        working-directory: engine
        run: cargo build --release --locked

      # What docs/BUILD.md puts in runtime/ by hand: the engine's
      # WebView2Loader.dll, and adb from the SDK's platform-tools, which the
      # runner image already has.
      - name: Runtime files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/engine, runtime/platform-tools | Out-Null
          # The GNU toolchain leaves it next to mirador.exe; with MSVC it stays
          # in webview2-com-sys's build output.
          $dll = Get-ChildItem "$env:CARGO_TARGET_DIR/release" -Recurse -Filter WebView2Loader.dll |
            Where-Object { $_.FullName -notmatch '\\(x86|arm64)\\' } | Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll not found under $env:CARGO_TARGET_DIR/release" }
          Copy-Item $dll.FullName runtime/engine/
          foreach ($f in 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll', 'NOTICE.txt') {
            Copy-Item "$env:ANDROID_HOME/platform-tools/$f" runtime/platform-tools/
          }

      # One of the app's tests creates an adb key with `adb keygen`, so adb
      # has to be on PATH; the runner image has it in the Android SDK.
      - name: adb on PATH
        shell: bash
        run: echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: App tests
        working-directory: app/src-tauri
        run: cargo test --release --locked

      - name: Package
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundle }} -- --locked
